<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>本地提取 sessionToken</title>
<style>
:root{color-scheme:light;--ink:#17212b;--muted:#647484;--line:#d9e1e8;--blue:#176b87;--paper:#f5f8fa;--red:#a93333}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:820px;margin:48px auto;padding:0 22px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 12px 38px #18354a0b}h1{font-size:clamp(1.6rem,4vw,2.2rem);line-height:1.2;margin:0 0 12px}p{color:var(--muted)}.notice{padding:14px 16px;background:#edf6f8;border-left:4px solid var(--blue);border-radius:8px;color:#234653;margin:20px 0}.notice strong{color:#173947}label{display:block;font-weight:650;margin:18px 0 8px}textarea{width:100%;min-height:190px;resize:vertical;border:1px solid #bdcbd5;border-radius:10px;padding:14px;font:14px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--ink)}button{border:0;border-radius:9px;background:var(--blue);color:white;padding:11px 17px;font-weight:650;cursor:pointer;margin:10px 8px 0 0}button.secondary{background:#e9eff3;color:#233744}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,textarea:focus-visible{outline:3px solid #59adc4;outline-offset:2px}.status{min-height:1.5em;color:var(--red);font-weight:600}#result{margin-top:20px;padding:16px;background:#f3f6f8;border:1px solid var(--line);border-radius:10px}.hint{font-size:.9rem;color:var(--muted);margin-top:18px}@media(max-width:600px){main{margin:22px auto}.card{padding:20px}}
</style>
</head>
<body>
<main><section class="card">
<h1>本地提取 sessionToken</h1>
<p>粘贴 JSON 后提取唯一的 <code>sessionToken</code>，并生成只包含该字段值的 TXT 文件。</p>
<div class="notice"><strong>本地处理：</strong>输入仅在当前浏览器内解析，不上传、不保存。完整 token 不会显示在网页上；生成的文本文件只包含 sessionToken，不包含其他字段。</div>
<label for="input">JSON 文本</label>
<textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder='{"sessionToken":"示例值","accessToken":"不会导出"}'></textarea>
<div><button id="extract" type="button">提取并生成 TXT</button><button id="download" class="secondary" type="button" disabled>下载 sessionToken.txt</button><button id="clear" class="secondary" type="button">清空</button></div>
<p id="status" class="status" role="status" aria-live="polite"></p>
<section id="result" hidden><strong>已找到唯一的 sessionToken</strong><div id="summary"></div></section>
<p class="hint">成功提取后点击“下载 sessionToken.txt”保存文件。若找到多个同名字段，会提示整理输入后再继续。</p>
</section></main>
<script>
"use strict";
const input=document.getElementById("input"),status=document.getElementById("status"),result=document.getElementById("result"),summary=document.getElementById("summary"),downloadButton=document.getElementById("download");
let sessionToken="";
function findSessionTokens(item,found=[]){if(Array.isArray(item)){for(const entry of item)findSessionTokens(entry,found)}else if(item&&typeof item==="object"){for(const [key,entry] of Object.entries(item)){if(key==="sessionToken"&&(typeof entry==="string"||typeof entry==="number"))found.push(String(entry));else findSessionTokens(entry,found)}}return found}
document.getElementById("extract").addEventListener("click",()=>{sessionToken="";downloadButton.disabled=true;summary.textContent="";result.hidden=true;status.style.color="#a93333";try{const found=findSessionTokens(JSON.parse(input.value));if(found.length===0){status.textContent="没有找到 sessionToken 字段。";return}if(found.length>1){status.textContent="找到多个 sessionToken；请整理为只包含一个该字段的 JSON。";return}sessionToken=found[0];downloadButton.disabled=sessionToken.length===0;summary.textContent=sessionToken.length?"已就绪（"+sessionToken.length+" 个字符）。完整值不会显示。":"字段值为空，无法生成文件。";result.hidden=false;status.style.color="#176b87";status.textContent=sessionToken.length?"sessionToken 已就绪，可下载 TXT 文件。":"sessionToken 为空。"}catch{status.textContent="JSON 格式无效，请检查输入。"}});
downloadButton.addEventListener("click",()=>{if(!sessionToken)return;const blob=new Blob([sessionToken],{type:"text/plain;charset=utf-8"});const url=URL.createObjectURL(blob);const link=document.createElement("a");link.href=url;link.download="sessionToken.txt";document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);status.style.color="#176b87";status.textContent="sessionToken.txt 已生成并下载。"});
document.getElementById("clear").addEventListener("click",()=>{input.value="";sessionToken="";summary.textContent="";result.hidden=true;downloadButton.disabled=true;status.textContent="输入和结果已清空。"});
</script>
</body>
</html>
